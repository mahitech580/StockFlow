name: StockFlow tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stockflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py auth.py db.py models.py schemas.py
      - name: Check browser JavaScript syntax
        run: node --check script.js
      - name: Validate Postman collection JSON
        run: python -c "import json; json.load(open('postman_collection.json', encoding='utf-8'))"
      - name: Validate Render YAML syntax
        run: python -c "import yaml; yaml.safe_load(open('render.yaml', encoding='utf-8'))"
      - name: Run tests
        run: pytest -q
      - name: Start FastAPI for HTTP smoke test
        run: |
          APP_ENV=development DATABASE_URL=sqlite:////tmp/stockflow-ci-smoke.db SECRET_KEY=ci-only-smoke-secret-with-more-than-32-characters uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/stockflow-server.log 2>&1 &
          echo $! > /tmp/stockflow-server.pid
      - name: Wait for app health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat /tmp/stockflow-server.log
          exit 1
      - name: Run end-to-end HTTP smoke test
        run: python smoke_test.py
      - name: Stop FastAPI smoke-test server
        if: always()
        run: |
          if [ -f /tmp/stockflow-server.pid ]; then
            kill "$(cat /tmp/stockflow-server.pid)" 2>/dev/null || true
          fi
