name: StockFlow live API smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-api-smoke.yml"
      - "scripts/live_smoke_test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check smoke-test syntax
        run: node --check scripts/live_smoke_test.mjs
      - name: Exercise production API
        env:
          STOCKFLOW_API_BASE_URL: https://citireafvqtqkuxvmail.supabase.co/functions/v1/stockflow-api
        run: node scripts/live_smoke_test.mjs
